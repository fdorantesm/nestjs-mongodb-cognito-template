name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: lint
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run ESLint
        run: yarn lint

  build:
    name: build
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build project
        run: yarn build

  unit-tests:
    name: unit-tests
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run unit tests
        run: yarn test --ci --runInBand

  e2e-tests:
    name: e2e-tests
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run e2e tests
        run: yarn test:e2e --runInBand --forceExit

  all-checks-passed:
    name: all-checks-passed
    needs: [lint, build, unit-tests, e2e-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify aggregate status
        run: |
          STATUS_OK=true
          for JOB_RESULT in \
            "lint:${{ needs.lint.result }}" \
            "build:${{ needs.build.result }}" \
            "unit-tests:${{ needs['unit-tests'].result }}" \
            "e2e-tests:${{ needs['e2e-tests'].result }}"; do
            JOB="${JOB_RESULT%%:*}"
            RESULT="${JOB_RESULT#*:}"
            if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
              echo "$JOB: $RESULT (failed)"
              STATUS_OK=false
            else
              echo "$JOB: $RESULT"
            fi
          done
          if [ "$STATUS_OK" != "true" ]; then
            echo "one or more jobs failed"
            exit 1
          fi
          echo "all jobs passed"
